services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATA_SOURCE: ${DATA_SOURCE:-elexon}      # set to "sample" for offline synthetic demo data
      CUTOFF_MODE: ${CUTOFF_MODE:-per_slot}
      HORIZON_HOURS: ${HORIZON_HOURS:-12}
      CACHE_DIR: /data
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      - elexon-cache:/data                      # first start downloads from Elexon, later starts are instant

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  elexon-cache:
